name: Build and Run tests

on:
  pull_request:
    branches: [main, develop]

jobs:
  pr-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # jest.config.ts has collectCoverage enabled and a coverageThreshold scoped to the new
      # recurring-transaction files (80% statements/branches/functions/lines) - `jest` itself
      # exits non-zero if any of those thresholds aren't met, so no separate coverage-check step
      # is needed. --ci disables interactive/watch behavior and fails on new/obsolete snapshots.
      - name: Test with coverage
        run: npx jest --ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: coverage/
          retention-days: 14

name: Build and Run tests

on:
  pull_request:
    branches: [main, develop]

jobs:
  pr-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production application
        env:
          API_URL: http://127.0.0.1:8080
          AUTH_SECRET: ci-build-only-not-a-production-secret
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
        run: npm run build

      # --ci disables interactive/watch behavior and fails on new/obsolete snapshots. Coverage
      # thresholds are no longer enforced locally here - Codecov's patch/project checks (see
      # codecov.yml) gate PRs instead, ratcheting coverage up over time without a hand-maintained
      # per-file list.
      - name: Test with coverage
        run: npx jest --ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true
